name: Claude Code Review

on:
  pull_request:
  issue_comment:
    types: [ created ]
  pull_request_review_comment:
    types: [ created ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: Claude Code Review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        persist-credentials: false

    - name: Run Claude Code Review
      uses: anthropics/claude-code-action@v1
      with:
        anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
        ## Comma-separated list of GitHub usernames allowed to trigger @claude.
        ## 'assisted-by-ai' is the org bot account that opens internal
        ## refactor PRs; without it on the list every bot-opened PR
        ## fails the actor check.
        ## Remove or leave empty to allow everyone.
        allowed_users: "adrelanos,ArrayBolt3,assisted-by-ai"
